[package]
name = "folio"
version = "0.2.2"
description = "A calm reader for PDF and Markdown"
authors = ["Arnav"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"

# Windows / macOS / Linux only: one window, files handed over from Explorer
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Android: write to the locations Android's "Save to…" screen returns (content:// URIs)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
